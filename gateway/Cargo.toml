[package]
name = "heimdall-gateway"
version = "0.5.0"
edition = "2021"
description = "Heimdall — Guardian of the LLM realm. Rust API Gateway proxying to vllm-mlx."
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client for proxying
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.21.0", features = ["trace"] }
opentelemetry_sdk = { version = "0.21.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.14.0", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.22.0"

# Time
chrono = "0.4"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Streaming
futures = "0.3"
bytes = "1"
sysinfo = "0.38.4"

# Native Embedding Engine (ONNX Runtime + CoreML on Apple Silicon)
fastembed = "5.13"

# 🌑 Skuggi PII Guardrail (Sprint 50b) — see ADR-007.
# Regex set lives in the shared `skuggi-core` crate over in Mimir's
# workspace; we pick it up via cross-repo path dep, same pattern Bifrost
# uses for `mimir-core-ai`. Local `regex` + `once_cell` deps stay because
# tier2 / metrics / other modules still use them.
skuggi-core = { path = "../../Mimir/ro-ai-bridge/skuggi-core" }
regex = "1.11"
once_cell = "1.20"
# Sprint 50b Day-1: per-tenant pii_mode lookup against Mimir's MariaDB.
# Heimdall reads tenant_configs directly with a short-TTL cache so the
# hot path stays sub-ms. Connection pool managed via sqlx.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "macros", "chrono", "json"] }
dashmap = "6.1"
getrandom = "0.2"

[dev-dependencies]
# Testing
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
